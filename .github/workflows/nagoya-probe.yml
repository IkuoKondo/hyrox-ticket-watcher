name: Nagoya readiness probe

on:
  schedule:
    # 1日3回、JSTの時間帯をずらして「待機列が無くなり監視できる状態か」を確認
    # UTC 01:00 / 09:00 / 15:00 = JST 10:00 / 18:00 / 翌00:00
    - cron: "0 1,9,15 * * *"
  workflow_dispatch: {}   # 手動実行ボタン用

concurrency:
  group: nagoya-probe
  cancel-in-progress: false

permissions:
  contents: write   # nagoya_state.json の更新をコミットするため

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: Python を用意
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 名古屋の監視可否をチェック
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python check_nagoya.py

      - name: 状態の変化を保存（変わったときだけコミット）
        if: always()
        run: |
          if [[ -n "$(git status --porcelain nagoya_state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add nagoya_state.json
            git commit -m "chore: update nagoya probe state [skip ci]"
            git push
          else
            echo "名古屋の状態に変化なし。コミットしません。"
          fi

      - name: 失敗時のデバッグ用スクショを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nagoya-debug
          path: debug/
          if-no-files-found: ignore
