name: HYROX ticket watch

on:
  schedule:
    # 5分おき（GitHub の都合で数分ずれる/間引かれることがあります＝ベストエフォート）
    - cron: "*/5 * * * *"
  workflow_dispatch:      # 手動実行ボタン用
    inputs:
      test_slack:
        description: "Slack通知のテスト送信だけ行う（空きチェックはしない）"
        type: boolean
        default: false

concurrency:
  group: hyrox-watch
  cancel-in-progress: false

permissions:
  contents: write   # state.json の更新をコミットするため

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v5

      - name: Python を用意
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 空き状況をチェック
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          TEST_SLACK: ${{ inputs.test_slack }}
        run: python check_tickets.py

      - name: 状態の変化を保存（変わったときだけコミット）
        if: always()
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update ticket state [skip ci]"
            git push
          else
            echo "状態に変化なし。コミットしません。"
          fi

      - name: 失敗時のデバッグ用スクショを保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot
          path: debug/
          if-no-files-found: ignore
